# Milestone 2C: fixed CPU-only synthetic-study closure protocol.
experiment:
  name: milestone2c_synthetic_closure_cpu
  output_dir: outputs/actmask/milestone2c
  device: cpu
  deterministic: true
  training_seeds: [1601, 2603, 3607, 4611, 5613]

dataset:
  training_master_seed: 20260718
  evaluation_master_seed: 20260719
  train_groups: 72
  val_groups: 48
  id_test_groups: 500
  ood_groups_per_axis: 250
  num_points: 48
  observation_frames: 4
  future_steps: 32
  observation_noise_std: 0.006
  point_dropout_rate: 0.04
  occlusion_rate: 0.08

model:
  architecture_candidates: [LocalNeighborhoodTemporalActMask, SetHistoryTemporalActMask]
  history_hidden_dim: 32
  action_hidden_dim: 20
  fusion_hidden_dim: 56
  contact_hidden_dim: 32
  utility_hidden_dim: 32

training:
  epochs: 12
  batch_size: 66
  evaluation_batch_size: 110
  learning_rate: 0.003
  weight_decay: 0.0001
  max_pos_weight: 12.0
  num_threads: 1

statistics:
  bootstrap_resamples: 2000
  permutation_samples: 4096
  confidence_level: 0.95

correspondence:
  modes:
    - per_frame_permutation
    - birth_death
    - per_frame_resampling
    - nearest_neighbor_noise
    - incorrect_local_matches
    - full_part_occlusion
    - instance_ambiguity
    - background_entry_exit
  point_counts: [32, 64]
  selection_mode: per_frame_permutation

ranking:
  candidate_counts: [5, 10, 20]
  validation_groups: 80
  test_groups: 500
  utility_selection_metric: regret_then_top1

calibration:
  bins: 15
  use_temperature_scaling: true
  use_platt_scaling: true

runtime:
  point_counts: [64, 128, 256, 512, 1024]
  history_lengths: [2, 4, 8]
  horizons: [4, 8, 16]
  candidate_counts: [1, 5, 10, 20]
  repeats: 40
  warmup: 8

gates:
  paired_id_ci_excludes_zero: true
  paired_ood_supported_conditions: 3
  action_or_history_ap_drop: 0.05
  velocity_counterfactual_accuracy: 0.80
  action_counterfactual_accuracy: 0.80
  irrelevant_stability: 0.85
  permutation_ap_drop_max: 0.02
  resampling_retention_min: 0.85
  utility_top1_delta: 0.03
  utility_regret_reduction: 0.15
  shared_ten_candidate_hz: 5.0
